# docker compose up db
# docker compose --profile full up

name: chorely

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chorely
      POSTGRES_PASSWORD: chorely
      POSTGRES_DB: chorely
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorely -d chorely"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://chorely:chorely@db:5432/chorely
      DEFAULT_ADMIN_PIN: ${DEFAULT_ADMIN_PIN:-1234}
      ADMIN_PIN_SESSION_TIMEOUT_MINUTES: ${ADMIN_PIN_SESSION_TIMEOUT_MINUTES:-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AVATAR_MODEL: ${AVATAR_MODEL:-}
      AVATAR_MODEL_FAST: ${AVATAR_MODEL_FAST:-}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - full

volumes:
  pgdata:
